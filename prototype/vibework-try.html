<title>VibeWork Try</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: same workplace shell as the Zippy game (top bar, rail, one pane); setup and planning screens run full-width without the rail */
:root{
  --bg:#f6f5fb; --panel:#ffffff; --ink:#1b1830; --muted:#625e7a; --line:#e2e0ee;
  --brand:#3b2fb8; --brand-ink:#ffffff; --mango:#f2a516; --mango-soft:#fff2d6;
  --me:#ebe8ff; --good:#1f8a55; --bad:#c2412d; --warn:#a86a00;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13111f; --panel:#1c1a2b; --ink:#ecebf5; --muted:#a6a2bf; --line:#2f2c44;
  --brand:#8f86ff; --brand-ink:#13111f; --mango:#f5b83d; --mango-soft:#3a2e14;
  --me:#2b2650; --good:#4cc488; --bad:#ef7a66; --warn:#e8b34a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111f; --panel:#1c1a2b; --ink:#ecebf5; --muted:#a6a2bf; --line:#2f2c44;
  --brand:#8f86ff; --brand-ink:#13111f; --mango:#f5b83d; --mango-soft:#3a2e14;
  --me:#2b2650; --good:#4cc488; --bad:#ef7a66; --warn:#e8b34a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
*{box-sizing:border-box}
button,textarea,input{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:250px 1fr}
.app.solo{grid-template-columns:1fr} .app.solo nav{display:none}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--brand);color:var(--brand-ink)}
.logo{font:800 22px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo span{color:var(--mango)}
.logo .trytag{font:700 11px var(--mono);letter-spacing:.1em;background:var(--mango);color:#1b1830;border-radius:5px;padding:2px 7px}
.role{font-size:14px;opacity:.88;min-width:0}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clock{font:500 14px var(--mono);background:rgba(0,0,0,.18);padding:4px 10px;border-radius:6px}
.reset{background:none;border:1px solid currentColor;border-radius:6px;padding:3px 10px;font-size:13px;cursor:pointer;opacity:.88}
nav{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px;
  padding-left:max(10px,env(safe-area-inset-left,0px))}
.navlabel{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-weight:700}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
.navbtn:hover{background:var(--bg)}
.navbtn[aria-current="true"]{background:var(--me);font-weight:700}
.navbtn:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--mango);outline-offset:2px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--body);color:#fff;flex:none}
.who{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.2}
.who small{color:var(--muted);font-weight:400;font-size:12px}
.badge{background:var(--mango);color:#1b1830;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.lock{font-size:11px;color:var(--muted)}
main{overflow-y:auto;min-width:0}
.pane{max-width:760px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:800 30px/1.15 var(--display);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
h2{font:700 20px/1.25 var(--display);margin:28px 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;max-width:65ch}
.mail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px}
.mailhead{font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.mailhead b{color:var(--ink)}
.mailbody{white-space:pre-wrap;max-width:65ch}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
td{vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
td.num{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.num{text-align:right}
td.miss{color:var(--bad)}
.callout{background:var(--mango-soft);border-radius:10px;padding:10px 14px;margin:14px 0 0;font-weight:600}
.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.review{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.review small{display:block;color:var(--muted);margin-top:6px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--brand)}
.tasks{display:flex;flex-direction:column;gap:12px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:28px 1fr;gap:12px}
.task.done{border-color:var(--good)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.task.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.task h3{margin:0 0 4px;font:700 17px/1.3 var(--display)}
.task p{margin:0 0 10px;color:var(--muted);max-width:65ch}
.task > div{min-width:0}
.hintbox{font-size:14.5px;background:var(--mango-soft);border-radius:8px;padding:6px 12px;margin:0 0 10px}
.hintbox summary{cursor:pointer;font-weight:700}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.hint{font-size:13px;color:var(--muted)}
.submitted{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px 12px;font-size:15px}
/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.chathead{display:flex;gap:12px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line);background:var(--panel);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chathead h2{margin:0;font-size:18px}
.chathead small{color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding-block:18px;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.msg{max-width:min(560px,85%);padding:9px 13px;border-radius:12px;white-space:pre-wrap;font-size:15.5px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--me);border-color:transparent}
.msg.sys{align-self:center;background:none;border:0;color:var(--muted);font-size:13px;text-align:center}
.compose{display:flex;gap:10px;padding-block:12px;border-top:1px solid var(--line);background:var(--panel);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.compose textarea{min-height:46px;height:46px;flex:1}
.attach{background:none;border:1px solid var(--line);border-radius:8px;width:46px;flex:none;cursor:pointer;font-size:18px}
.attach:hover{border-color:var(--brand)}
.attach.on{border-color:var(--bad);color:var(--bad)}
.micbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.pending{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:8px;border-top:1px solid var(--line);background:var(--panel);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pending img{height:56px;max-width:100px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumb{position:relative;display:inline-block}
.thx{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:13px;line-height:20px;cursor:pointer;padding:0}
.mimg{display:block;max-width:100%;max-height:260px;margin-top:8px;border-radius:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.useb{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--brand);cursor:pointer}
.useb:hover{border-color:var(--brand)}
.note{font-size:13px;color:var(--bad);padding:0 16px 8px}
/* progress */
.verdict{font:600 19px/1.4 var(--display);background:var(--mango-soft);border-radius:12px;padding:14px 18px}
ul.clean{padding-left:20px;margin:6px 0}
.nextbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--mango-soft);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nextbar .btn{padding:6px 16px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--mango);border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:left}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:20px;margin-top:18px}
.empty h2{margin-top:0}
.overview{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:20px}
.big{display:flex;flex-direction:column;gap:2px}
.big .n{display:flex;align-items:baseline;gap:6px}
.big .n span{font:800 56px/1 var(--display);color:var(--brand)}
.big small{color:var(--muted);font-family:var(--mono)}
.overview .verdict{flex:1;min-width:240px}
.practice{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:2px 8px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .bl{display:flex;justify-content:space-between;gap:10px}
.bn{font-family:var(--mono);font-variant-numeric:tabular-nums}
.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:5px 0}
.fill{height:100%;background:var(--mango);border-radius:6px}
.fill.lo{background:var(--bad)} .fill.hi{background:var(--good)}
.bar p{margin:0;font-size:14.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.col.good{border-top:4px solid var(--good)} .col.fix{border-top:4px solid var(--bad)}
.col h3{margin:0;font:700 17px var(--display)}
.tfb{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.tfb summary{cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.cmp > div{min-width:0}
.k{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.submitted.ideal{border-left:3px solid var(--good)}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:inherit;text-decoration:none}
.res:hover{border-color:var(--brand)}
.res small{color:var(--muted)} .res p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.rt{align-self:flex-start;font:700 11px var(--mono);background:var(--me);color:var(--brand);border-radius:6px;padding:1px 8px;margin-bottom:4px}
.rt.w{background:var(--mango-soft);color:var(--ink)}
.drill{background:var(--mango-soft);border-radius:12px;padding:12px 16px;margin-top:14px}
/* setup + planning */
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.hero h1{font-size:40px}
.hero .kick{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
#jobin{min-height:150px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lvl{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0}
.lvl b{font:700 17px var(--display)}
.lvl span{font-size:14px;color:var(--muted)}
.lvl[aria-pressed="true"]{border:2px solid var(--brand);background:var(--me)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:26px}
.flow div{border-top:2px solid var(--line);padding-top:8px;font-size:14.5px;color:var(--muted);min-width:0}
.flow b{display:block;color:var(--ink);font-family:var(--display)}
.resume{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:22px}
.steps{display:flex;flex-direction:column;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--mono);border:2px solid var(--line);color:var(--muted)}
.step.run .ic{border-color:var(--mango);color:var(--mango)}
.step.ok .ic{background:var(--good);border-color:var(--good);color:#fff}
.step.bad .ic{background:var(--bad);border-color:var(--bad);color:#fff}
.step b{display:block}
.step div{min-width:0}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ck{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14.5px}
.pill{font:700 11px var(--mono);letter-spacing:.06em;border-radius:5px;padding:2px 7px;text-transform:uppercase;white-space:nowrap}
.pill.pass{background:var(--good);color:#fff} .pill.warn{background:var(--mango-soft);color:var(--warn);border:1px solid var(--warn)} .pill.fail{background:var(--bad);color:#fff}
.ck small{display:block;color:var(--muted)}
.flag{border:1px solid var(--warn);background:var(--mango-soft);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.ready{background:var(--panel);border:2px solid var(--good);border-radius:12px;padding:16px 18px;margin-top:16px}
.ready h2{margin-top:0}
pre.plan{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:420px;overflow:auto}
.dots{animation:blink 1.2s steps(4,end) infinite}
@keyframes blink{50%{opacity:.35}}
@media (max-width:720px){
  .two,.cmp,.lib,.levels,.flow{grid-template-columns:1fr}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .app.solo{grid-template-rows:auto 1fr}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px))}
  .navlabel{display:none}
  .navbtn{width:auto;flex:none}
  .who small{display:none}
  h1{font-size:25px} .hero h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app solo" id="app">
  <header>
    <div class="logo">vibe<span>work</span> <span class="trytag">TRY</span></div>
    <div class="role" id="rolebar">Vibe check any job</div>
    <div class="hdr-r">
      <div class="clock" id="clock" hidden>09:00 AM</div>
      <button class="reset" id="restart" type="button" hidden>Restart day</button>
      <button class="reset" id="newjob" type="button" hidden>New job</button>
    </div>
  </header>
  <nav id="nav" aria-label="Workspace"></nav>
  <main id="main"></main>
</div>

<script>
/* ============ constants ============ */
const KEY="vibework-try-v1";
const LEVELS={
  beginner:{label:"Beginner",blurb:"Clean data, helpful colleagues, a hint on every task.",pulls:25,colleagues:3},
  medium:{label:"Medium",blurb:"Realistic data, one pushy stakeholder, no hints.",pulls:18,colleagues:4},
  advanced:{label:"Advanced",blurb:"Messy data, tough stakeholders, conflicting asks.",pulls:12,colleagues:5}
};
const LEVEL_RULES={
  beginner:"Boss plus exactly 3 colleagues. Clean, round numbers; dashboard of 5–7 rows. Colleagues are cooperative and answer slightly vague questions generously. The twist is a simple, clearly risky request that a careful beginner can turn down with one fact. Every task has a 'hint' field: one friendly sentence on how to approach it, never the answer.",
  medium:"Boss plus exactly 4 colleagues. Realistic numbers; dashboard of 7–9 rows. The info source needs precise questions. The twist sender pushes back once before accepting a measured alternative. No 'hint' fields.",
  advanced:"Boss plus exactly 5 colleagues. Messy, realistic data; dashboard of 9–12 rows, including one average that hides a split and one figure with a data-quality problem (the info source can reveal the problem as a hidden fact). Two colleagues have conflicting agendas, the boss is demanding and short on time, the brief is slightly ambiguous, and the twist has a tight deadline and pushes back twice. No 'hint' fields."
};
const PALETTE=["#3b2fb8","#1f8a55","#d0661f","#b0306b","#2a6fa8","#6b5b16","#0f766e","#7c3aed"];
const EXAMPLES=["Customer Support Executive at a food delivery app","Social Media Marketing Executive","Retail Store Manager","Recruiter (tech hiring)","Supply Chain Analyst","Event Planner for weddings"];
/* well-known real names that must not appear in a plan. Case-sensitive, whole words. Ambiguous everyday words (Apple, Shell, Target, Visa…) are left to the AI review. */

function normalize(b,level){
  if(!b||typeof b!=="object"||Array.isArray(b)) return null;
  const t=b.track=(b.track&&typeof b.track==="object")?b.track:{}, d=b.day=(b.day&&typeof b.day==="object")?b.day:{};
  t.cast=Array.isArray(t.cast)?t.cast:[]; d.characters=Array.isArray(d.characters)?d.characters:[];
  t.cast.forEach((c,i)=>{c.id=ID(c.id); c.color=PALETTE[i%PALETTE.length]; c.initials=String(c.name||c.id).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")});
  d.characters.forEach(c=>{c.id=ID(c.id); c.hidden_facts=Array.isArray(c.hidden_facts)?c.hidden_facts.filter(f=>f&&f.fact):[]; if(c.limits&&c.limits.data_pulls!=null) c.limits.data_pulls=LEVELS[level].pulls; if(!Array.isArray(c.reply_flags)) delete c.reply_flags; if(c.available!=="locked") c.available="start"});
  d.tasks=Array.isArray(d.tasks)?d.tasks:[]; d.triggers=Array.isArray(d.triggers)?d.triggers:[];
  d.tasks.forEach(x=>{if(x.submit_to) x.submit_to=ID(x.submit_to); if(level!=="beginner") delete x.hint});
  d.public=(d.public&&typeof d.public==="object")?d.public:{}; ["inbox","reviews","documents"].forEach(k=>{if(!Array.isArray(d.public[k]))d.public[k]=[]});
  const db=d.public.dashboard=(d.public.dashboard&&typeof d.public.dashboard==="object")?d.public.dashboard:{};
  if(!Array.isArray(db.columns))db.columns=[]; if(!Array.isArray(db.rows))db.rows=[]; if(!Array.isArray(db.notes))db.notes=[];
  d.group_chats=[]; d.clock=d.clock||{start:"09:00",end:"17:30",steps:[]}; if(!Array.isArray(d.clock.steps)) d.clock.steps=[];
  d.scoring=d.scoring||{}; d.scoring.expected_answers=d.scoring.expected_answers||{};
  b.ledger=Array.isArray(b.ledger)?b.ledger:[]; b.claims=Array.isArray(b.claims)?b.claims:[];
  const fix=(c)=>{ if(!c||typeof c!=="object") return;
    if(c.counter_at_least&&c.counter_at_least.counter){const [a,...r]=String(c.counter_at_least.counter).split("."); c.counter_at_least.counter=ID(a)+"."+r.join(".").toLowerCase()}
    if(c.messages_sent) c.messages_sent.to=ID(c.messages_sent.to);
    (c.all||[]).forEach(fix); (c.any||[]).forEach(fix) };
  d.tasks.forEach(x=>fix(x.done_when)); d.clock.steps.forEach(s=>fix(s.when));
  d.triggers.forEach(tr=>{ fix(tr.when); (Array.isArray(tr.do)?tr.do:[]).forEach(a=>{ if(!a) return; if(a.unlock) a.unlock=ID(a.unlock); if(a.message&&a.message.from) a.message.from=ID(a.message.from); if(a.ai_reply&&a.ai_reply.from) a.ai_reply.from=ID(a.ai_reply.from); if(typeof a.open==="string"&&a.open.startsWith("chat:")) a.open="chat:"+ID(a.open.slice(5)) }) });
  d.public.inbox.forEach(m=>{ if(m) m.from=ID(m.from) });
  t.skills=Array.isArray(t.skills)?t.skills:[]; t.learning_library=t.learning_library||{};
  return b;
}
function evalFormula(src,vals){
  const s=String(src); const toks=s.match(/[A-Za-z_][A-Za-z0-9_]*|\d+(?:\.\d+)?|[-+*/()]/g)||[];
  if(toks.join("")!==s.replace(/\s+/g,"")) throw new Error("uses characters other than ids, numbers and + - * / ( )");
  let i=0; const peek=()=>toks[i], next=()=>toks[i++];
  function expr(){let v=term(); while(peek()==="+"||peek()==="-"){const o=next(); const r=term(); v=o==="+"?v+r:v-r} return v}
  function term(){let v=fac(); while(peek()==="*"||peek()==="/"){const o=next(); const r=fac(); v=o==="*"?v*r:v/r} return v}
  function fac(){const t=next(); if(t==="("){const v=expr(); if(next()!==")") throw new Error("missing )"); return v} if(t==="-") return -fac(); if(t===undefined) throw new Error("ends early"); if(/^\d/.test(t)) return parseFloat(t); if(Object.prototype.hasOwnProperty.call(vals,t)) return vals[t]; throw new Error("refers to unknown id "+t)}
  const v=expr(); if(i<toks.length) throw new Error("has extra symbols"); return v;
}
function checkCond(c,ctx,errs,where,depth){

  if(!c||typeof c!=="object"){errs.push(`${where}: missing condition`);return}
  if("submitted" in c||"task_done" in c){const id=c.submitted??c.task_done; if(!ctx.tasks.includes(id)) errs.push(`${where}: refers to unknown task "${id}"`); return}
  if(c.counter_at_least){const m=/^([a-z0-9_-]+)\.(data_pulls|messages|questions)$/.exec(String(c.counter_at_least.counter||"")); if(!m||!ctx.chars.includes(m[1])) errs.push(`${where}: unknown counter "${c.counter_at_least.counter}"`); return}
  if(c.messages_sent){if(!ctx.chars.includes(ID(c.messages_sent.to))) errs.push(`${where}: messages to unknown person "${c.messages_sent.to}"`); return}
  if("trigger_fired" in c){if(!ctx.triggers.includes(c.trigger_fired)) errs.push(`${where}: refers to unknown trigger "${c.trigger_fired}"`); return}
  if(Array.isArray(c.all)){c.all.forEach(x=>checkCond(x,ctx,errs,where,depth+1)); return}
  if(Array.isArray(c.any)){c.any.forEach(x=>checkCond(x,ctx,errs,where,depth+1)); return}
  errs.push(`${where}: condition type not in the scenario format`);
}
function codeChecks(b,level,scr){
  const out=[]; const add=(name,errs,warns,okText)=>out.push({name,status:errs.length?"fail":warns.length?"warn":"pass",detail:errs.length?errs.slice(0,4).join("; "):warns.length?warns.slice(0,3).join("; "):okText,errs,warns});
  const t=b.track, d=b.day;
  /* 1. format */
  let e=[],w=[];
  ["title","theme","story_so_far","world_today","canon_after_day"].forEach(k=>{if(!d[k]) e.push(`day.${k} missing`)});
  if(!t.company||!t.company.name||!t.company.world_briefing||!t.company.one_liner) e.push("track.company incomplete");
  if(!t.role) e.push("track.role missing");
  if(!t.style_rules) e.push("track.style_rules missing");
  if(t.skills.length!==6) e.push(`needs 6 skills, has ${t.skills.length}`);
  if(!d.public.inbox.length) e.push("inbox is empty");
  if(d.public.dashboard.columns.length<2||d.public.dashboard.rows.length<4) e.push("dashboard needs columns and at least 4 rows");
  d.public.dashboard.rows.forEach((r,i)=>{if(!r||!Array.isArray(r.cells)||r.cells.length!==d.public.dashboard.columns.length) e.push(`dashboard row ${i+1} doesn't match the columns`)});
  ["t1","t2","t3","t4"].forEach(k=>{if(!d.scoring.expected_answers[k]) e.push(`expected answer for ${k} missing`)});
  if(!d.scoring.strong_player) e.push("scoring.strong_player missing");
  add("Format matches our scenario format",e,w,"track and day fields all present");
  /* 2. cast */
  e=[];w=[];
  const chars=d.characters.map(c=>c.id), boss=bossId();
  const colleagues=chars.length-1;
  if(colleagues<3||colleagues>5) e.push(`needs a boss and 3–5 colleagues, has ${colleagues} colleagues`);
  if(colleagues!==LEVELS[level].colleagues) w.push(`${level} level expects ${LEVELS[level].colleagues} colleagues, has ${colleagues}`);
  if(new Set(chars).size!==chars.length) e.push("two characters share an id");
  d.characters.forEach(c=>{const k=castOf(c.id); if(!k) e.push(`"${c.id}" has no cast entry`); else if(!k.persona) e.push(`${k.name||c.id} has no persona`)});
  if(!chars.includes(boss)) e.push("the boss (who tasks are sent to) isn't in today's cast");
  else if(charOf(boss).available==="locked") e.push("the boss is locked at the start");
  const infos=d.characters.filter(c=>(c.reply_flags||[]).includes("returned_data"));
  if(infos.length!==1) e.push(`needs exactly one info source with returned_data, has ${infos.length}`);
  else{ if(!infos[0].limits||!infos[0].limits.data_pulls) e.push("info source has no data-pull limit"); if(infos[0].hidden_facts.length<4) e.push(`info source holds ${infos[0].hidden_facts.length} hidden facts, needs at least 4`) }
  const totalFacts=d.characters.reduce((a,c)=>a+c.hidden_facts.length,0);
  if(totalFacts<5) e.push(`only ${totalFacts} hidden facts in total`);
  d.characters.forEach(c=>c.hidden_facts.forEach(f=>{if(!f.reveal_if) w.push(`fact "${f.id||"?"}" has no reveal_if`)}));
  const locked=d.characters.filter(c=>c.available==="locked");
  if(!locked.length) e.push("no locked twist character");
  add(`Boss and ${colleagues} colleagues with agendas`,e,w,`${totalFacts} hidden facts; ${infos[0]?(castOf(infos[0].id)||{}).name:"?"} holds the data`);
  /* 3. tasks + triggers */
  e=[];w=[];
  const ctx={tasks:d.tasks.map(x=>x.id),chars,triggers:d.triggers.map(x=>x.id)};
  if(d.tasks.length!==4) e.push(`needs 4 tasks, has ${d.tasks.length}`);
  if(new Set(ctx.tasks).size!==ctx.tasks.length) e.push("two tasks share an id");
  d.tasks.forEach(x=>{
    if(!x.title||!x.description) e.push(`task ${x.id} needs a title and description`);
    if(x.kind!=="submission"&&x.kind!=="chat") e.push(`task ${x.id} kind must be submission or chat`);
    if(x.kind==="submission"&&!chars.includes(x.submit_to)) e.push(`task ${x.id} is sent to unknown "${x.submit_to}"`);
    if(x.kind==="chat"&&!x.done_when) e.push(`chat task ${x.id} has no done_when`);
    if(x.done_when){ if(x.done_when.task_done===x.id) e.push(`task ${x.id} depends on itself`); checkCond(x.done_when,ctx,e,`task ${x.id}`) }
    if(level==="beginner"&&!x.hint) w.push(`task ${x.id} has no beginner hint`);
  });
  if(d.tasks.filter(x=>x.kind==="submission").length<2) e.push("needs at least 2 submission tasks");
  d.triggers.forEach(tr=>{
    if(!tr.id) e.push("a trigger has no id");
    checkCond(tr.when,ctx,e,`trigger ${tr.id}`);
    if(!Array.isArray(tr.do)||!tr.do.length) e.push(`trigger ${tr.id} does nothing`);
    (tr.do||[]).forEach(a=>{
      if(a.message){if(!chars.includes(ID(a.message.from))) e.push(`trigger ${tr.id}: message from unknown "${a.message.from}"`); if(!a.message.text) e.push(`trigger ${tr.id}: empty message`)}
      else if(a.unlock){if(!chars.includes(ID(a.unlock))) e.push(`trigger ${tr.id}: unlocks unknown "${a.unlock}"`)}
      else if(a.ai_reply){if(!chars.includes(ID(a.ai_reply.from))) e.push(`trigger ${tr.id}: reply from unknown "${a.ai_reply.from}"`)}
      else if(a.open){const o=String(a.open); if(!(o.startsWith("chat:")&&chars.includes(o.slice(5)))&&!["tasks","dashboard","brief"].includes(o)) e.push(`trigger ${tr.id}: opens unknown screen "${o}"`)}
      else e.push(`trigger ${tr.id}: action not in the scenario format`);
    });
  });
  locked.forEach(c=>{ if(!d.triggers.some(tr=>(tr.do||[]).some(a=>ID(a.unlock)===c.id||ID(a.message&&a.message.from)===c.id))) e.push(`${(castOf(c.id)||{}).name||c.id} is locked and nothing unlocks them`) });
  const twist=d.triggers.find(tr=>(tr.do||[]).some(a=>a.message&&locked.some(c=>c.id===ID(a.message.from))));
  if(!twist) e.push("no mid-day twist message from a locked colleague");
  (d.clock.steps||[]).forEach((s,i)=>{checkCond(s.when,ctx,e,`clock step ${i+1}`); if(toMin(s.time)<0) e.push(`clock step ${i+1} has a bad time`)});
  add("4 tasks, triggers and the twist wire up",e,w,`twist from ${twist?first(ID(twist.do.find(a=>a.message).message.from)):"?"}; every reference resolves`);
  /* 4. numbers */
  e=[];w=[];
  const vals={}; let formulas=0, okF=0;
  b.ledger.forEach(x=>{ if(x&&x.id!=null&&typeof x.value==="number"&&isFinite(x.value)) vals[String(x.id)]=x.value; else if(x) e.push(`ledger "${x.id}" has no numeric value`) });
  if(b.ledger.length<6) e.push(`ledger has ${b.ledger.length} numbers, needs at least 6`);
  b.ledger.forEach(x=>{ if(!x||!x.formula) return; formulas++;
    try{ const v=evalFormula(x.formula,vals); const tol=Math.max(Math.abs(x.value)*0.05,0.6);
      if(!isFinite(v)) e.push(`"${x.label||x.id}" formula divides by zero`);
      else if(Math.abs(v-x.value)>tol) e.push(`"${x.label||x.id}" is ${x.value} but its formula gives ${Math.round(v*100)/100}`);
      else okF++;
    }catch(err){ e.push(`"${x.label||x.id}" formula ${err.message}`) } });
  if(formulas<4) e.push(`only ${formulas} formulas tie numbers together, needs 4`);
  b.ledger.forEach(x=>{ if(x&&/%/.test(x.label||"")&&!/change|growth|vs|differ|gap|uplift|drop/i.test(x.label||"")&&(x.value<0||x.value>100)) e.push(`"${x.label}" is a percentage outside 0–100`) });
  let okC=0;
  if(b.claims.length<3) e.push(`only ${b.claims.length} claims check the story's comparisons, needs 3`);
  b.claims.forEach(c=>{ if(!c) return; const ops={">":(a,z)=>a>z,"<":(a,z)=>a<z,">=":(a,z)=>a>=z,"<=":(a,z)=>a<=z};
    const f=ops[String(c.op||"").trim()]; if(!f){ e.push(`claim "${c.text}" has an unknown comparison "${c.op}"`); return }
    try{ const L=evalFormula(String(c.left),vals), R=evalFormula(String(c.right),vals);
      if(!f(L,R)) e.push(`claim "${c.text}" is false: ${Math.round(L*100)/100} is not ${c.op} ${Math.round(R*100)/100}. Change the numbers or the story and everything that relies on it`); else okC++;
    }catch(err){ e.push(`claim "${c.text}" ${err.message}`) } });
  const cellNums=[]; d.public.dashboard.rows.forEach(r=>(r.cells||[]).slice(1).forEach(c=>{const m=String(c).replace(/−/g,"-").match(/-?\d[\d,]*(?:\.\d+)?/); if(m) cellNums.push(parseFloat(m[0].replace(/,/g,"")))}));
  const ledgerVals=Object.values(vals); const hit=cellNums.filter(n=>ledgerVals.some(v=>Math.abs(v-n)<=Math.max(Math.abs(n)*0.01,0.01))).length;
  if(cellNums.length&&hit/cellNums.length<0.5) w.push(`only ${hit} of ${cellNums.length} dashboard figures are tracked in the ledger`);
  add("Numbers and conclusions add up",e,w,`${okF} of ${formulas} formulas and ${okC} of ${b.claims.length} conclusions check out; ${hit} of ${cellNums.length} dashboard figures tracked`);
  /* 5. brands */
  e=[];w=[];
  const text=strings({track:{...t,learning_library:undefined},day:d},["learning_library","color","initials"]).join("\n");
  const found=new Set();
  BRANDS.forEach(br=>{ if(new RegExp(`(?<![A-Za-z0-9])${reEsc(br)}(?![A-Za-z0-9])`).test(text)) found.add(br) });
  (scr&&scr.employer_names||[]).forEach(n=>{ n=String(n||"").trim(); if(n.length>=3&&new RegExp(`(?<![A-Za-z0-9])${reEsc(n)}(?![A-Za-z0-9])`,"i").test(text)) found.add(n) });
  if(found.size) e.push(`real names found: ${[...found].slice(0,6).join(", ")}`);
  const cname=String(t.company&&t.company.name||"").replace(/[^A-Za-z]/g,"");
  if(cname){ const close=BRANDS.concat(PLATFORMS,scr&&scr.employer_names||[]).map(x=>String(x).replace(/[^A-Za-z]/g,"")).filter(x=>x.length>=4).find(x=>{const dd=lev(cname,x); return cname.toLowerCase()===x.toLowerCase()||(cname.length>=5&&dd<=2)||(cname.length<5&&dd<=1)}); if(close) e.push(`company name "${t.company.name}" is too close to a real brand`) }
  add("No real brands",e,w,`company "${t.company?t.company.name:"?"}" is fictional; no known brands found`);
  return out;
}

/* ============ setup → screen → plan → check ============ */
function linkOnly(t){ const rest=String(t).replace(/https?:\/\/\S+|www\.\S+/gi,"").replace(/\s+/g," ").trim(); return rest.length<25&&/https?:\/\/|www\./i.test(t) }
const LINK_MSG="I can't open links: the page is sealed off from the internet, and job sites need a login. Open the job, copy the description text, and paste it here. Or just type the role.";
async function startGeneration(){
  const input=S.input.trim().slice(0,6000);
  if(!sample){render();return}
  if(linkOnly(input)){ S.phase="setup"; S.setupErr=LINK_MSG; save(); render(); return }
  S.screen=null; S.bundle=null; S.report=null; S.game=null;
  S.gen={status:"running",step:"screen",attempt:0,chars:0,checks:[],audit:null,err:null,stage:{}};
  S.phase="gen"; save(); render();
  genCtl=new AbortController();
  let scr;
  try{ scr=await sample.json(SCREEN_PROMPT(input),{modelTier:"quick",signal:genCtl.signal}) }
  catch(e){ return genFail(e.code==="cancelled"?"Stopped.":copyFor(e.code)) }
  if(!scr||typeof scr!=="object") return genFail("The job couldn't be read. Try again.");
  if(BLOCK_KW.test(scr.role_title||"")&&scr.regulation==="none") scr.regulation="flag";
  S.screen=scr; S.gen.stage.screen="ok";
  if(scr.is_job===false){ S.gen.status="failed"; S.gen.structural=true; S.gen.err=(scr.reason?scr.reason+" ":"")+"Paste the job description text, or type a role such as 'Retail Store Manager'."; save(); render(); return }
  if(scr.regulation==="block"){ S.phase="blocked"; S.gen.status="done"; save(); render(); return }
  save(); render();
  let issues=null, last=null, garbled=0;
  for(let attempt=1;attempt<=2+garbled;attempt++){
    const mode=(attempt>1&&last&&!last.structural&&last.bundle)?"repair":"fresh";
    S.gen.attempt=attempt; S.gen.mode=mode; S.gen.step="plan"; S.gen.chars=0; S.gen.checks=[]; S.gen.audit=null; save(); render();
    let b;
    try{
      b=await sample.json(mode==="repair"?REPAIR_PROMPT(last.bundle,S.level,issues):PLAN_PROMPT(scr,input,S.level,issues),{modelTier:"default",cache:false,signal:genCtl.signal,onText:({text})=>{S.gen.chars=text.length; const el=document.getElementById("genchars"); if(el) el.textContent=text.length.toLocaleString("en-IN")}});
    }catch(e){
      if(e.code==="cancelled") return genFail("Stopped.");
      if(e.code==="invalid_json"){ b=salvage(e.text);
        if(!b){ if(garbled<1){ garbled++; issues=(issues||[]).concat(["Your last reply was not valid JSON or was cut off. Reply with only the JSON object, and keep every text field short."]); continue }
          return genFail("The AI's answer came back garbled twice. Try again; shorter job posts help.") } }
      else return genFail(copyFor(e.code));
    }
    S.bundle=normalize(b,S.level);
    if(!S.bundle){ issues=["The reply was not one JSON object with track, day and ledger."]; continue }
    S.gen.step="check"; save(); render();
    const checks=codeChecks(S.bundle,S.level,scr);
    const structural=checks.slice(0,3).some(c=>c.status==="fail");
    let audit=null;
    if(!structural){
      try{ audit=await sample.json(AUDIT_PROMPT(S.bundle,S.level),{modelTier:"default",cache:false,signal:genCtl.signal}) }
      catch(e){ if(e.code==="cancelled") return genFail("Stopped."); audit={skipped:true} }
    }
    const majors=(audit&&Array.isArray(audit.issues)?audit.issues:[]).filter(x=>x&&x.severity==="major").map(x=>String(x.text));
    const minors=(audit&&Array.isArray(audit.issues)?audit.issues:[]).filter(x=>x&&x.severity!=="major").map(x=>String(x.text));
    checks.push({name:"AI review: realism, level, consistency",status:audit&&audit.skipped?"warn":structural?"warn":majors.length?"fail":minors.length?"warn":"pass",
      detail:audit&&audit.skipped?"The AI review didn't run; the automatic checks still did.":structural?"Skipped until the structure is fixed.":majors.length?majors.slice(0,3).join(" "):minors.length?minors.slice(0,2).join(" "):"No issues found.",errs:majors,warns:minors});
    S.gen.checks=checks; last={checks,structural,bundle:S.bundle};
    const fails=checks.filter(c=>c.status==="fail");
    if(!fails.length){ S.gen.status="ready"; S.gen.step="ready"; save(); render(); return }
    issues=fails.flatMap(c=>c.errs).slice(0,14);
    if(attempt===1){ S.gen.regen=issues.length; S.gen.firstFails=issues.slice(0,6); save(); render() }
  }
  S.gen.status="failed"; S.gen.step="failed"; S.gen.structural=!!(last&&last.structural);
  S.gen.err=S.gen.structural?"The plan still breaks the format after one retry, so it can't be played. Try again; plans differ each time.":"The plan still has issues after one retry. You can play it anyway (issues are listed above) or try again.";
  save(); render();
}
function salvage(text){
  if(!text) return null; let t=String(text).replace(/```(?:json)?/gi,"");
  const a=t.indexOf("{"), z=t.lastIndexOf("}"); if(a<0||z<=a) return null; t=t.slice(a,z+1);
  t=t.replace(/[\u201C\u201D]/g,'"').replace(/,\s*([}\]])/g,"$1");
  try{ return JSON.parse(t) }catch(e){ return null }
}
function genFail(msg){ S.gen.status="failed"; S.gen.err=msg; S.gen.structural=true; save(); render() }

function startPlay(){
  const d=B().day;
  const g={view:"brief",seenInbox:false,sub:{},c:{},fired:{},unlocked:{},threads:{},unread:{},feedback:null,feedbackErr:null,toast:null,nudged:false};
  g.threads.mentor=[{f:"them",t:`Hi, I'm ${person("mentor").name}, a ${person("mentor").role.replace(/, your mentor$/i,"").toLowerCase()} and your mentor today. I'll coach you on how this job is done, but I won't give away today's answers. Once your last task is in, I'll debrief your whole day.`}];
  g.threads.assist=[{f:"them",t:`Hi, I'm Saathi, your AI assistant. I can see your chats and your submitted work. Two jobs: (1) help you work: summarise what people said, combine inputs, poke holes in your thinking, draft clear requests; (2) make you an AI-powered ${ROLE()}: show which AI tools and prompts a modern professional would use for each task, and how to use them safely.`}];
  g.unread.mentor=0; g.unread.assist=0;
  d.characters.forEach(c=>{ g.threads[c.id]=c.opener&&c.available!=="locked"?[{f:"them",t:String(c.opener)}]:[]; g.unread[c.id]=0 });
  S.game=g; S.phase="play"; save(); render();

/* ============ game engine (conditions, triggers, clock) ============ */
function cond(c,depth){
  depth=depth||0; const g=G(); if(!c||typeof c!=="object"||depth>8) return false;
  if("submitted" in c) return !!g.sub[c.submitted];
  if("task_done" in c){const t=taskOf(c.task_done); return t?taskDone(t,depth+1):false}
  if(c.counter_at_least) return (g.c[c.counter_at_least.counter]||0)>=Number(c.counter_at_least.value||0);
  if(c.messages_sent) return (g.c[ID(c.messages_sent.to)+".messages"]||0)>=Number(c.messages_sent.at_least||1);
  if("trigger_fired" in c) return !!g.fired[c.trigger_fired];
  if(Array.isArray(c.all)) return c.all.every(x=>cond(x,depth+1));
  if(Array.isArray(c.any)) return c.any.some(x=>cond(x,depth+1));
  return false;
}
function taskDone(t,depth){ if(t.kind==="submission"&&!t.done_when) return !!G().sub[t.id]; return cond(t.done_when,depth) }
const isAvail=(id)=>{const c=charOf(id); return !!c&&(c.available!=="locked"||!!G().unlocked[id])};
const dayOver=()=>B().day.tasks.filter(t=>t.kind==="submission").every(t=>!!G().sub[t.id]);
function chatTarget(t){const w=t.done_when||{}; if(w.counter_at_least) return String(w.counter_at_least.counter).split(".")[0]; if(w.messages_sent) return ID(w.messages_sent.to); return null}
function clockText(){const ck=B().day.clock||{}; let t=ck.start||"09:00"; for(const s of ck.steps||[]) if(cond(s.when)&&toMin(s.time)>toMin(t)) t=s.time; return fmtTime(t)}
const replyQueue=[]; let draining=false;
function ensureThread(id){const g=G(); if(!g.threads[id]) g.threads[id]=[]; if(g.unread[id]==null) g.unread[id]=0}
function runTriggers(){
  const g=G(), fired=[]; let changed=true, guard=0;
  while(changed&&guard++<20){ changed=false;
    for(const tr of B().day.triggers){
      if(g.fired[tr.id]||!cond(tr.when)) continue;
      g.fired[tr.id]=true; changed=true; fired.push(tr);
      for(const a of tr.do||[]){
        if(a.unlock) g.unlocked[ID(a.unlock)]=true;
        else if(a.message){const f=ID(a.message.from); g.unlocked[f]=true; ensureThread(f); g.threads[f].push({f:"them",t:String(a.message.text)}); if(g.view!=="chat:"+f){g.unread[f]=(g.unread[f]||0)+1; g.toast=f}}
        else if(a.open){g.view=String(a.open); if(g.view.startsWith("chat:")){g.unread[g.view.slice(5)]=0; if(g.toast===g.view.slice(5)) g.toast=null}}
        else if(a.ai_reply) replyQueue.push({from:ID(a.ai_reply.from),direction:String(a.ai_reply.direction||"")});
      }
    }
  }
  save(); drainQueue(); return fired;
}
async function drainQueue(){ if(draining) return; draining=true; try{ while(replyQueue.length){ const r=replyQueue.shift(); await reply(r.from,r.direction) } } finally{ draining=false } }

function attachMic(btn,ta,tell){
  btn.onclick=()=>{
    if(btn._rec){ try{btn._rec.stop()}catch(e){} return }
    if(!SR){ tell(DICTATE_TIP); ta.focus(); return }
    let rec; try{ rec=new SR() }catch(e){ tell(DICTATE_TIP); ta.focus(); return }
    rec.lang="en-IN"; rec.interimResults=true; rec.continuous=true;
    const base=ta.value?ta.value.replace(/\s*$/," "):""; let fin="";
    rec.onresult=(e)=>{ let tmp=""; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript; else tmp+=r[0].transcript } ta.value=base+fin+tmp; ta.dispatchEvent(new Event("input")) };
    rec.onerror=(e)=>{ tell((e.error==="not-allowed"||e.error==="service-not-allowed"?"The microphone is blocked inside this page. ":"Dictation stopped. ")+DICTATE_TIP); ta.focus() };
    rec.onend=()=>{ btn._rec=null; btn.classList.remove("on"); btn.textContent="🎤"; btn.setAttribute("aria-label","Dictate") };

  const mp=$(`<div class="drill" style="margin-top:18px"><b>Get your full debrief.</b> ${esc(person("mentor").name)}, your mentor, reviews all your chats: what you did right, 3 improvement areas quoting your own words, the right approach to today, and exercises for this week.<div class="row"><button class="btn" type="button">Get my debrief</button></div></div>`);
  mp.querySelector("button").onclick=()=>sendTo("mentor",PLAN_REQ); pg.append(mp);
  const r=$(`<div class="row" style="margin-top:24px"><button class="btn ghost" type="button" id="rescore">Re-score</button><button class="btn ghost" type="button" id="replay">Replay this day</button><button class="btn ghost" type="button" id="another">Try another job</button></div>`);
  r.querySelector("#rescore").onclick=()=>{g.feedback=null;getFeedback()};
  r.querySelector("#replay").onclick=()=>startPlay();
  r.querySelector("#another").onclick=()=>{S.phase="setup"; save(); render()};
  pg.append(r);
  planPanels(pg,true);
  return p;
}
function planPanels(pg,spoil){
  const checks=(S.gen&&S.gen.checks)||[];
  if(checks.length){ const d=$(`<details class="tfb" style="margin-top:24px"><summary><b>How this day was checked</b><span class="hint">${checks.filter(c=>c.status==="pass").length} of ${checks.length} checks passed${S.gen.attempt>1?" · regenerated once":""}</span></summary><div class="checks"></div></details>`);
    checks.forEach(c=>d.querySelector(".checks").append($(`<div class="ck"><span class="pill ${c.status}">${c.status}</span><div>${esc(c.name)}<small>${esc(c.detail||"")}</small></div></div>`))); pg.append(d) }
  if(spoil){ const txt=JSON.stringify({track:B().track,day:B().day,ledger:B().ledger},null,2);
    const d=$(`<details class="tfb"><summary><b>See the plan file</b><span class="hint">The full day in our scenario format, hidden facts included. Copy it to save a good day.</span></summary><div class="row" style="margin:10px 0"><button class="btn ghost" type="button">Copy</button><span class="hint" id="cpd"></span></div><pre class="plan" tabindex="0"></pre></details>`);
    const pre=d.querySelector("pre"); pre.textContent=txt;
    d.querySelector("button").onclick=()=>{const done=()=>d.querySelector("#cpd").textContent="Copied."; try{navigator.clipboard.writeText(txt).then(done,()=>{selectAll(pre);d.querySelector("#cpd").textContent="Selected. Press Ctrl+C or Cmd+C."})}catch(e){selectAll(pre)}};
    pg.append(d) }
}
function selectAll(el){const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r)}

function nextStep(){
  const g=G(), D=B().day;
  if(!g.seenInbox) return ["Read your welcome email in the Inbox.","brief"];
  const un=D.characters.map(c=>c.id).find(k=>g.unread[k]>0); if(un) return [`${first(un)} sent you a message. Read it.`,"chat:"+un];
  for(const t of D.tasks){ if(taskDone(t)) continue;
    if(t.kind==="submission") return [`${t.title}: write it on the Tasks page.`,"tasks"];
    const to=chatTarget(t); if(to&&isAvail(to)) return [`${t.title}. Message ${first(to)}.`,"chat:"+to];
  }
  if(D.tasks.some(t=>!taskDone(t))){ const src=infoId(); return [`Keep working: ask ${first(src)} another question, or check in with a colleague.`,"chat:"+src] }
  if(!g.feedback) return ["Your day is done. Get your practice score.","feedback"];
  if(!g.threads.mentor.some(m=>m.t===PLAN_REQ)) return [`Get your debrief from ${person("mentor").name}, your mentor.`,"chat:mentor"];
  return ["Review your score, replay the day, or try another job.","feedback"];
}
function nextBar(){ const [msg,to]=nextStep(); const b=$(`<div class="nextbar"><span><b>Next:</b> ${esc(msg)}</span><button class="btn" type="button">Go</button></div>`); if(G().view===to) b.querySelector("button").hidden=true; b.querySelector("button").onclick=()=>go(to); return b }
function go(v){ const g=G(); if(!g) return; g.view=v; if(v.startsWith("chat:")){g.unread[v.slice(5)]=0; if(g.toast===v.slice(5)) g.toast=null} save(); render() }

/* ============ render ============ */
function render(){
  const app=document.getElementById("app"), main=document.getElementById("main");
  const play=S.phase==="play"&&B()&&G();
  app.classList.toggle("solo",!play);
  document.getElementById("clock").hidden=!play;
  document.getElementById("restart").hidden=!play;
  document.getElementById("newjob").hidden=S.phase==="setup";
  document.getElementById("rolebar").textContent=play?`You: ${ROLE()}, ${B().track.company.name} · ${LEVELS[S.level].label} practice day`:"Vibe check any job";
  main.innerHTML="";
  const old=document.getElementById("toast"); if(old) old.remove();
  if(!play){ document.getElementById("nav").innerHTML=""; main.append(S.phase==="gen"?viewGen():S.phase==="blocked"?viewBlocked():viewSetup()); return }
  document.getElementById("clock").textContent=clockText();
  renderNav();
  const g=G(), v=g.view;
  const node=v==="dashboard"?viewDashboard():v==="tasks"?viewTasks():v==="feedback"?viewProgress():v.startsWith("chat:")&&(charOf(v.slice(5))||v==="chat:assist"||v==="chat:mentor")?viewChat(v.slice(5)):viewBrief();
  main.append(node);
  if(!v.startsWith("chat:")) main.prepend(nextBar());
  if(g.toast&&v!=="chat:"+g.toast){ const id=g.toast; const t=$(`<button class="toast" id="toast" type="button">${av(id)}<span><b>${esc(person(id).name)}</b> sent you a message. Open it</span></button>`); t.onclick=()=>{g.toast=null;go("chat:"+id)}; document.body.append(t) } else g.toast=null;
  main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
const armed=(btn,label,fn)=>{ if(btn.dataset.armed){delete btn.dataset.armed; btn.textContent=label; fn(); return} btn.dataset.armed="1"; btn.textContent="Tap again to confirm"; setTimeout(()=>{delete btn.dataset.armed; btn.textContent=label},3000) };
document.getElementById("restart").onclick=(e)=>armed(e.currentTarget,"Restart day",()=>startPlay());
document.getElementById("newjob").onclick=(e)=>armed(e.currentTarget,"New job",()=>{ if(genCtl) genCtl.abort(); S.phase="setup"; if(S.gen&&S.gen.status==="running") S.gen.status="interrupted"; save(); render() });
render();
</script>
